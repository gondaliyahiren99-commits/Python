<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SkillBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-main d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5 p-md-0">
                <div class="text-center mb-4 slide-up">
                    <a class="navbar-brand fs-3 mb-1 d-inline-block" href="../index.html">
                        <i class="bi bi-briefcase-fill text-primary"></i> SkillBridge
                    </a>
                    <h4 class="fw-bold text-dark mt-3">Join our community</h4>
                    <p class="text-muted">Take the next step in your career journey.</p>
                </div>
                
                <div class="card shadow-lg border-0 slide-up delay-100">
                    <div class="card-body p-4 p-sm-5">
                        <!-- Role Selection Toggle -->
                        <ul class="nav nav-pills nav-fill bg-light p-1 border rounded-pill mb-4" id="rolePills" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active rounded-pill fw-medium py-2" id="seeker-tab" data-bs-toggle="pill" data-bs-target="#seeker" type="button" role="tab">Job Seeker</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link rounded-pill fw-medium py-2" id="employer-tab" data-bs-toggle="pill" data-bs-target="#employer" type="button" role="tab">Employer / HR</button>
                            </li>
                        </ul>

                        <form novalidate>
                            <div class="row g-3 mb-3">
                                <div class="col-sm-6">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-control form-control-lg" placeholder="e.g. John" required>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control form-control-lg" placeholder="e.g. Doe" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control form-control-lg" placeholder="you@domain.com" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control form-control-lg border-end-0" id="reg-password" placeholder="Must be at least 8 characters" required>
                                    <span class="input-group-text bg-white border-start-0 text-muted" style="cursor: pointer;" onclick="const el=document.getElementById('reg-password'); el.type=el.type==='password'?'text':'password'; this.innerHTML=el.type==='password'?'<i class=\'bi bi-eye\'></i>':'<i class=\'bi bi-eye-slash\'></i>';">
                                        <i class="bi bi-eye"></i>
                                    </span>
                                </div>
                                <div class="form-text mt-2 text-muted">
                                    Include at least 1 uppercase, 1 lowercase and 1 number.
                                </div>
                            </div>

                            <div class="mb-4 form-check ps-4">
                                <input type="checkbox" class="form-check-input" id="terms" required>
                                <label class="form-check-label text-muted text-sm user-select-none" for="terms">
                                    By clicking Join, you agree to the <a href="terms.html">User Agreement</a>, <a href="privacy.html">Privacy Policy</a>, and <a href="#">Cookie Policy</a>.
                                </label>
                            </div>
                            
                            <button type="button" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
                                Agree & Join
                            </button>
                        </form>
                        
                        <div class="d-flex align-items-center my-4 text-muted">
                            <hr class="flex-grow-1 border-secondary opacity-25">
                            <span class="px-3 text-sm fw-medium">or register with</span>
                            <hr class="flex-grow-1 border-secondary opacity-25">
                        </div>
                        
                        <div class="d-grid gap-3 mb-2 row mx-0">
                            <button class="col btn btn-light border fw-medium d-flex align-items-center justify-content-center gap-2 py-2 me-2">
                                <i class="bi bi-google text-danger"></i> Google
                            </button>
                            <button class="col btn btn-light border fw-medium d-flex align-items-center justify-content-center gap-2 py-2 ms-2">
                                <i class="bi bi-linkedin text-primary"></i> LinkedIn
                            </button>
                        </div>
                    </div>
                    <div class="card-footer bg-light border-top-0 text-center py-4">
                        <span class="text-muted">Already on SkillBridge?</span> 
                        <a href="login.html" class="fw-semibold text-decoration-none">Sign in</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
