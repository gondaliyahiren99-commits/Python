{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JobSphere Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-card">

    <h1 class="logo">JobSphere</h1>

    <div class="role-selector">

        <button class="role-btn active"
                id="jobseekerBtn"
                onclick="selectRole('jobseeker')">

            <i class="bi bi-person-workspace"></i>
            <span>Job Seeker</span>

        </button>

        <button class="role-btn"
                id="companyBtn"
                onclick="selectRole('company')">

            <i class="bi bi-buildings-fill"></i>
            <span>Company</span>

        </button>

    </div>

    <div class="role-icon" id="roleIcon">
        <i class="bi bi-person-workspace"></i>
    </div>

    <h2 id="roleTitle">Job Seeker Login</h2>

    <form method="POST">

        {% csrf_token %}

        <input type="hidden"
               id="role"
               name="role"
               value="jobseeker">

        <div class="input-box">
            <i class="bi bi-envelope-fill"></i>
            <input type="email"
                   placeholder="Email_Address">
        </div>

        <div class="input-box">
            <i class="bi bi-lock-fill"></i>
            <input type="password"
                   placeholder="Password">
        </div>
        <div class="options-row">

    <label class="remember">

        <input type="checkbox">

        Remember Me

    </label>

    <a href="#" class="forgot-link">

        Forgot Password?

    </a>

</div>
<div class="terms-box">

    <input
        type="checkbox"
        required>

    <span>
        I agree to the
        <a href="#">
            Terms & Conditions
        </a>
        and
        <a href="#">
            Privacy Policy
        </a>
    </span>

</div>
        <button type="submit"
                class="login-btn">
            Sign In
        </button>
        <div class="register-box">

    Don't have an account?

    <a href="#">
        Register Here
    </a>

</div>

    </form>

</div>

<script>

function selectRole(role){

    let title =
    document.getElementById("roleTitle");

    let icon =
    document.getElementById("roleIcon");

    document.getElementById("role").value = role;

    document
    .getElementById("jobseekerBtn")
    .classList.remove("active");

    document
    .getElementById("companyBtn")
    .classList.remove("active");

    if(role === "jobseeker"){

        document
        .getElementById("jobseekerBtn")
        .classList.add("active");

        title.innerHTML =
        "Job Seeker Login";

        icon.innerHTML =
        '<i class="bi bi-person-workspace"></i>';

    }else{

        document
        .getElementById("companyBtn")
        .classList.add("active");

        title.innerHTML =
        "Company Login";

        icon.innerHTML =
        '<i class="bi bi-buildings-fill"></i>';
    }
}
</script>

</body>
</html>
