<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SkillBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body class="bg-main d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4 p-md-0">
                <div class="text-center mb-4 slide-up">
                    <a class="navbar-brand fs-3 mb-1 d-inline-block" href="../index.html">
                        <i class="bi bi-briefcase-fill text-primary"></i> SkillBridge
                    </a>
                    <h4 class="fw-bold text-dark mt-3">Welcome Back!</h4>
                    <p class="text-muted">Stay updated on your professional world.</p>
                </div>
                
                <div class="card shadow-lg border-0 slide-up delay-100">
                    <div class="card-body p-4 p-sm-5">
                        <form novalidate>
                            <div class="mb-4">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control form-control-lg" id="email" placeholder="you@domain.com" required>
                                <div class="invalid-feedback">Please enter a valid email address.</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label d-flex justify-content-between align-items-center">
                                    Password
                                    <a href="forgot-password.html" class="text-sm fw-medium text-decoration-none">Forgot password?</a>
                                </label>
                                <div class="input-group">
                                    <input type="password" class="form-control form-control-lg border-end-0" id="password" placeholder="••••••••" required>
                                    <span class="input-group-text bg-white border-start-0 text-muted" style="cursor: pointer;" onclick="const el=document.getElementById('password'); el.type=el.type==='password'?'text':'password'; this.innerHTML=el.type==='password'?'<i class=\'bi bi-eye\'></i>':'<i class=\'bi bi-eye-slash\'></i>';">
                                        <i class="bi bi-eye"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="mb-4 form-check ps-4">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label text-muted user-select-none" for="rememberMe">Keep me signed in</label>
                            </div>
                            
                            <button type="button" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
                                Sign In
                            </button>
                        </form>
                        
                        <div class="d-flex align-items-center my-4 text-muted">
                            <hr class="flex-grow-1 border-secondary opacity-25">
                            <span class="px-3 text-sm fw-medium">or continue with</span>
                            <hr class="flex-grow-1 border-secondary opacity-25">
                        </div>
                        
                        <div class="d-grid gap-3 mb-2">
                            <button class="btn btn-light border fw-medium d-flex align-items-center justify-content-center gap-2 py-2">
                                <i class="bi bi-google text-danger"></i> Google
                            </button>
                            <button class="btn btn-light border fw-medium d-flex align-items-center justify-content-center gap-2 py-2">
                                <i class="bi bi-linkedin text-primary"></i> LinkedIn
                            </button>
                        </div>
                    </div>
                    <div class="card-footer bg-light border-top-0 text-center py-4">
                        <span class="text-muted">New to SkillBridge?</span> 
                        <a href="register.html" class="fw-semibold text-decoration-none">Create an account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
