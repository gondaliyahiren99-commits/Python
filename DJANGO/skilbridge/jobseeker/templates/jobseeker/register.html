{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobSphere | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'jobseeker/css/register.css'%}">
</head>
<body>

<div class="register-card">

    <h1 class="logo">JobSphere</h1>

    <p class="subtitle">
        Create your professional account
    </p>

    <!-- Role Selection -->

    <div class="role-selector">
        
        <button type="button"
                class="role-btn active"
                id="jobseekerBtn"
                onclick="selectRole('jobseeker')">

            <i class="bi bi-person-workspace"></i>
            Job Seeker

        </button>

        <button type="button"
                class="role-btn"
                id="companyBtn"
                onclick="selectRole('company')">

            <i class="bi bi-buildings-fill"></i>
            Company

        </button>

    </div>

    <form method="post" action="{% url 'register' %}">

        {% csrf_token %}

        <input type="hidden"
               name="role"
               id="role"
               value="jobseeker">

        <!-- Common Fields -->

        <div class="section-title">
            Account Information
        </div>

        <div class="row">

            <div class="col-md-6">
                <div class="input-box">
                    <i class="bi bi-person"></i>
                    <input type="text"
                           placeholder="First Name" name = 'first_name' >
                </div>
            </div>

            <div class="col-md-6">
                <div class="input-box">
                    <i class="bi bi-person"></i>
                    <input type="text"
                           placeholder="Last Name" name='last_name'>
                </div>
            </div>

        </div>

        <div class="input-box">
            <i class="bi bi-envelope-fill"></i>
            <input type="email"
                   placeholder="Email Address" name ='email'>
        </div>


        <div class="input-box">
            <i class="bi bi-telephone-fill"></i>
            <input type="text"
                   placeholder="Mobile Number" name='phone_number'>

        </div>
        <div class="input-box">
            <i class="bi bi-geo-alt-fill"></i>
            <select class= "form-control form-controle-premium" name='role'>
                <option disabled selected >Select Location</option>
                <option value="jobseeker">jobseeker</option>
                <option value="compnay">compnay</option>

                
            </select>
                 

        </div>

        <div class="row">

            <div class="col-md-6">
                <div class="input-box">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password"
                           placeholder="Password" name = 'password'>
                </div>
            </div>

            <div class="col-md-6">
                <div class="input-box">
                    <i class="bi bi-shield-lock-fill"></i>
                    <input type="password"
                           placeholder="Confirm Password" name = 'confirm_password'>
                </div>
            </div>

        </div>

        <!-- Job Seeker Section -->

        <div id="jobseekerSection">

            <div class="section-title">
                Professional Information
            </div>

            <div class="input-box">
                <i class="bi bi-tools"></i>
                <input type="text"
                       placeholder="Skills (Python, Django, React...)" name='skills'>
            </div>

    
        </div>

        <!-- Company Section -->

        <div id="companySection" style="display:none;">

            <div class="section-title">
                Company Information
            </div>

            <div class="input-box">
                <i class="bi bi-buildings-fill"></i>
                <input type="text"
                       placeholder="Company Name" name ='company_name'>
            </div>

            <div class="input-box">
                <i class="bi bi-globe"></i>
                <input type="url"
                       placeholder="Company Website">
            </div>

            <div class="input-box">
                <i class="bi bi-briefcase-fill"></i>
                <input type="text"
                       placeholder="Industry Type">
            </div>

            <div class="input-box">
                <i class="bi bi-people-fill"></i>
                <input type="text"
                       placeholder="Company Size">
            </div>

            <textarea class="custom-textarea"
                      placeholder="About Company"></textarea>

            <div class="upload-box">
                <label>
                    Upload Company Logo
                </label>
                <input type="file">
            </div>

            <div class="input-box">
                <i class="bi bi-person-badge-fill"></i>
                <input type="text"
                       placeholder="Recruiter Name">
            </div>

            <div class="input-box">
                <i class="bi bi-linkedin"></i>
                <input type="url"
                       placeholder="Company LinkedIn URL">
            </div>

        </div>

        <!-- Terms -->

        <div class="terms-box">

            <input type="checkbox"  name= 'terms' required>

            <span>
                I agree to the
                <a href="#">Terms & Conditions</a>
                and
                <a href="#">Privacy Policy</a>
            </span>

        </div>

        <input type="submit"
                class="register-btn" value='Create Account'>

            

        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Login Here
            </a>

        </div>

    </form>

</div>

<script>

function selectRole(role){

    document.getElementById("role").value = role;

    document.getElementById("jobseekerBtn")
            .classList.remove("active");

    document.getElementById("companyBtn")
            .classList.remove("active");

    if(role === "jobseeker"){

        document.getElementById("jobseekerBtn")
                .classList.add("active");

        document.getElementById("jobseekerSection")
                .style.display = "block";

        document.getElementById("companySection")
                .style.display = "none";
    }
    else{

        document.getElementById("companyBtn")
                .classList.add("active");

        document.getElementById("jobseekerSection")
                .style.display = "none";

        document.getElementById("companySection")
                .style.display = "block";
    }
}

</script>

</body>
</html>
