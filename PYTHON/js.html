<input type="text" id="name" placeholder="Enter Name">
<button onclick="add()">Add</button>

<div id="myid"></div>

<script>
    function add() {
        // Input field ko select karo
        let name = document.getElementById("name");

        // Div ko select karo
        let div = document.getElementById("myid");

        // Naya h3 element banao
        let h3 = document.createElement("h3");

        // Input ki value h3 me set karo
        h3.innerText = name.value;

        // h3 ko div ke andar add karo
        div.appendChild(h3);

        // Input clear kar do
        name.value = "";
    }
</script>

<input type="text" id="name" placeholder="Enter Name">
<button onclick="add()">Add</button>

<ul id="myList"></ul>

<script>
    function add() {
        let name = document.getElementById("name");
        let list = document.getElementById("myList");

        
        let li = document.createElement("li");

        
        li.innerText = name.value;

        
        list.append(li);

        
        name.value = "";
    }
</script>
